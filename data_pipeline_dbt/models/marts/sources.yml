version: 2



sources:
  - name: staging
    description: "The silver layer "
    database: department_store
    schema: staging
    tables:
      - name: stg_table
        description: "staging e-commerce event logs"
  

models:
  - name: dim_products
    description: "Clean dictionary of all unique products with categories and brands."
    columns:
      - name: product_id
        description: "Primary key for products."
        tests:
          - unique
          - not_null

  - name: dim_category
    description: "all categories"
    columns:
      - name: category_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "log dates"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_users
    description: "log user"
    columns:
      - name: user_id
        tests:
          - unique
          - not_null


  - name: fct_events
    description: "Core fact table containing all e-commerce actions."
    columns:
      - name: event_key
        tests:
          - unique
          - not_null

    
