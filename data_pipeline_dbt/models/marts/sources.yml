version: 2



sources:
  - name: staging
    description: "The silver layer "
    database: department_store
    schema: staging
    tables:
      - name: stg_table
        description: "staging e-commerce event logs"

models:
  - name: dim_products
    description: "Clean dictionary of all unique products with categories and brands."
    columns:
      - name: product_id
        description: "Primary key for products."
        tests:
          - unique
          - not_null

  - name: dim_category
    description: "all categories"
    columns:
      - name: category_id
        description: "Primary key for category"
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "log dates"
    columns:
      - name: date_key
        description: "Primary key for category"
        tests:
          - unique
          - not_null


